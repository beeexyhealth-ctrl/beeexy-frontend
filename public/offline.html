<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#4340E8" />
    <title>Beeexy is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f5fa;color:#0f0f14;font-family:Arial,sans-serif}.card{width:min(100%,360px);padding:28px 24px;border:1px solid rgba(15,15,20,.08);border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(15,15,20,.09);text-align:center}.logo{display:block;width:180px;height:auto;margin:0 auto 20px}.eyebrow{margin:0;color:#4340e8;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:8px 0 7px;font-size:24px;letter-spacing:-.03em}p{margin:0;color:#5c5c72;font-size:13px;line-height:1.55}.privacy{margin:17px 0;padding:11px;border-radius:12px;background:rgba(16,185,129,.1);color:#047857;font-size:11px;line-height:1.45}button{width:100%;min-height:44px;border:0;border-radius:12px;background:#4340e8;color:#fff;font:600 13px Arial,sans-serif;cursor:pointer}button:hover{background:#3734d2}button:focus-visible{outline:3px solid rgba(67,64,232,.3);outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/brand/beeexy-logo.png" alt="Beeexy" width="1534" height="491" />
      <p class="eyebrow">Connection paused</p>
      <h1>You’re offline</h1>
      <p>Reconnect to continue your Beeexy journey.</p>
      <div class="privacy">For your privacy, Beeexy does not cache assessments, appointments, or health records for offline access.</div>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
